<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Business One</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            background-color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        /* Container Kiri */
        #left-container {
            width: 300px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            flex-shrink: 0;
            position: relative;
        }

        /* Resizer Line */
        #resizer {
            width: 4px;
            height: 100%;
            background-color: #d0d0d0;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        #resizer:hover, #resizer.is-dragging {
            background-color: #1890ff;
        }

        /* Header Kiri */
        #left-header {
            height: 60px;
            border-bottom: 1px solid #d0d0d0;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            flex-shrink: 0;
        }

        /* Button Action Icon (Menggunakan SVG Murni) */
        .action-btn-wrapper {
            background: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            outline: none;
            flex-shrink: 0;
        }

        .action-btn-wrapper:hover {
            background-color: #e0e0e0;
            border-color: #bbb;
        }

        .action-btn-wrapper svg {
            width: 20px;
            height: 20px;
            fill: #333333;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #333333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Floating Card Dropdown Menu */
        .floating-card {
            position: absolute;
            top: 52px;
            left: 16px;
            width: 180px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border: 1px solid #dcdcdc;
            padding: 6px 0;
            z-index: 99999;
            display: none; /* Controlled by JS */
        }

        .floating-card.show {
            display: block !important;
        }

        .floating-card ul {
            list-style: none;
        }

        .floating-card li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            font-size: 13px;
            color: #333333;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .floating-card li a:hover {
            background-color: #f5f5f5;
        }

        .floating-card li.divider {
            height: 1px;
            background-color: #e8e8e8;
            margin: 4px 0;
        }

        .floating-card li a.logout {
            color: #ff4d4f;
        }

        .floating-card li a.logout:hover {
            background-color: #fff1f0;
        }

        /* Menu Tree Container */
        #file-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px 8px;
        }

        .tree-menu, .tree-submenu {
            list-style: none;
        }

        .tree-item {
            user-select: none;
            margin-bottom: 2px;
        }

        .tree-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            color: #333333;
            border-radius: 10px;
            transition: background-color 0.2s, border-radius 0.2s;
        }

        .tree-header:hover {
            background-color: #f2f2f2;
        }

        .tree-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-icon {
            width: 12px;
            height: 12px;
            margin-right: 10px;
            flex-shrink: 0;
            transition: transform 0.3s ease-in-out;
            transform: rotate(0deg);
            fill: #666;
        }

        .tree-item.expanded > .tree-header .arrow-icon {
            transform: rotate(90deg);
        }

        .tree-submenu {
            display: none;
            padding-left: 12px;
        }

        .tree-item.expanded > .tree-submenu {
            display: block;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .tree-submenu li {
            margin-top: 2px;
        }

        .tree-submenu li a {
            display: block;
            padding: 8px 12px 8px 28px;
            font-size: 13px;
            color: #555555;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s;
        }

        .tree-submenu li a:hover {
            background-color: #e8e8e8;
            color: #000000;
        }

        /* Container Kanan */
        #right-container {
            flex: 1;
            height: 100%;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        .is-dragging iframe {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Container Kiri -->
    <div id="left-container">
        <div id="left-header">
            <!-- Tombol Menu dengan SVG Murni (Dijamin Muncul) -->
            <button class="action-btn-wrapper" id="actionBtn" type="button" title="Menu Options">
                <svg viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>

            <span class="header-title">Ananta Business One</span>
        </div>

        <!-- Floating Card Dropdown -->
        <div class="floating-card" id="actionCard">
            <ul>
                <li>
                    <a href="javascript:void(0)" onclick="alert('Buka Profile')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        Profile
                    </a>
                </li>
                <li>
                    <a href="javascript:void(0)" onclick="alert('Buka Settings')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </li>
                <li class="divider"></li>
                <li>
                    <a href="javascript:void(0)" class="logout" onclick="alert('Proses Logout')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Logout
                    </a>
                </li>
            </ul>
        </div>
        
        <!-- Menu Tree Container -->
        <div id="file-list">
            <ul class="tree-menu">
                <li class="tree-item">
                    <div class="tree-header">
                        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                        <span class="tree-title">Office</span>
                    </div>
                    <ul class="tree-submenu">
                        <li><a href="about:blank" target="content-frame">Submenu Office 1</a></li>
                        <li><a href="about:blank" target="content-frame">Submenu Office 2</a></li>
                    </ul>
                </li>

                <li class="tree-item">
                    <div class="tree-header">
                        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                        <span class="tree-title">Accounting</span>
                    </div>
                    <ul class="tree-submenu">
                        <li><a href="about:blank" target="content-frame">Submenu Accounting 1</a></li>
                        <li><a href="about:blank" target="content-frame">Submenu Accounting 2</a></li>
                    </ul>
                </li>

                <li class="tree-item">
                    <div class="tree-header">
                        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                        <span class="tree-title">Logistic</span>
                    </div>
                    <ul class="tree-submenu">
                        <li><a href="about:blank" target="content-frame">Submenu Logistic 1</a></li>
                        <li><a href="about:blank" target="content-frame">Submenu Logistic 2</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

    <!-- Element Resizer -->
    <div id="resizer"></div>

    <!-- Container Kanan -->
    <div id="right-container">
        <iframe id="content-frame" name="content-frame" src="about:blank"></iframe>
    </div>

    <!-- Script Handling -->
    <script>
        const actionBtn = document.getElementById('actionBtn');
        const actionCard = document.getElementById('actionCard');

        // Toggle Floating Card Popover
        actionBtn.onclick = function(e) {
            e.stopPropagation();
            actionCard.classList.toggle('show');
        };

        // Tutup Popover jika klik di luar
        document.onclick = function(e) {
            if (!actionCard.contains(e.target) && e.target !== actionBtn) {
                actionCard.classList.remove('show');
            }
        };

        // Accordion Tree Menu
        document.querySelectorAll('.tree-header').forEach(header => {
            header.onclick = function() {
                const item = this.parentElement;
                item.classList.toggle('expanded');
            };
        });

        // Resizer Logic
        const leftContainer = document.getElementById('left-container');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.onmousedown = function() {
            isResizing = true;
            document.body.classList.add('is-dragging');
            resizer.classList.add('is-dragging');
        };

        document.onmousemove = function(e) {
            if (!isResizing) return;
            let newWidth = e.clientX;
            if (newWidth < 50) newWidth = 50;
            if (newWidth > window.innerWidth - 50) newWidth = window.innerWidth - 50;
            leftContainer.style.width = newWidth + 'px';
        };

        document.onmouseup = function() {
            if (isResizing) {
                isResizing = false;
                document.body.classList.remove('is-dragging');
                resizer.classList.remove('is-dragging');
            }
        };
    </script>
</body>
</html>
