<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Business One</title>
    <style>
        /* --- VARIABEL WARNA (SAP Horizon Light, Dark & Signature Blue Status Bar) --- */
        [data-theme="light"] {
            --sap-background-color: #f5f6f7;
            --sap-shell-color: #ffffff;
            --sap-toolbar-color: #ffffff;
            --sap-sidebar-color: #ffffff;
            --sap-border-color: #d5dadd;
            --sap-text-primary: #223548;
            --sap-text-secondary: #5b738b;
            --sap-interactive-color: #0070f2;
            --sap-btn-hover: #f0f2f4;
            --sap-tree-hover: #eaf3fc;
            --sap-tree-selected: #d0e5fa;
            --sap-folder-back: #e59312;
            --sap-folder-front: #f3b738;
            --sap-arrow-color: #6a6d70;
            
            /* Status Bar Signature Blue Theme */
            --sap-statusbar-bg: #dbe5f1;
            --sap-statusbar-border: #abb8c7;
            --sap-statusbar-text: #1e395b;
            --sap-statusbar-field-bg: #ffffff;
            --sap-statusbar-field-border: #b1c1d8;
        }

        [data-theme="dark"] {
            --sap-background-color: #12171c;
            --sap-shell-color: #1d232a;
            --sap-toolbar-color: #1d232a;
            --sap-sidebar-color: #181e24;
            --sap-border-color: #2e3742;
            --sap-text-primary: #f5f6f7;
            --sap-text-secondary: #899eb3;
            --sap-interactive-color: #4db2ff;
            --sap-btn-hover: #2a333d;
            --sap-tree-hover: #25313d;
            --sap-tree-selected: #1d3954;
            --sap-folder-back: #f0a828;
            --sap-folder-front: #ffcc00;
            --sap-arrow-color: #a2b4c7;

            /* Status Bar Signature Dark */
            --sap-statusbar-bg: #1c2733;
            --sap-statusbar-border: #2e3d4e;
            --sap-statusbar-text: #d0e1f9;
            --sap-statusbar-field-bg: #111822;
            --sap-statusbar-field-border: #32455a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background-color: var(--sap-background-color);
            color: var(--sap-text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
        }

        /* 1. HEADER CONTAINER */
        .sap-header-container {
            background-color: var(--sap-shell-color);
            height: 48px;
            border-bottom: 1px solid var(--sap-border-color);
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .sap-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            color: var(--sap-text-primary);
        }

        .sap-header-brand span {
            color: var(--sap-interactive-color);
        }

        .sap-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-switch-btn {
            background: none;
            border: 1px solid var(--sap-border-color);
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            color: var(--sap-text-primary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-switch-btn:hover {
            background-color: var(--sap-btn-hover);
        }

        .sap-user-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--sap-interactive-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        /* 2. MENU BAR CONTAINER */
        .sap-menu-bar-container {
            background-color: var(--sap-toolbar-color);
            height: 36px;
            border-bottom: 1px solid var(--sap-border-color);
            width: 100%;
        }

        /* 3. BODY CONTAINER */
        .sap-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        /* 4. SIDEBAR CONTAINER (SAP MENU PANEL) */
        .sap-sidebar-container {
            width: 280px;
            min-width: 180px;
            max-width: 600px;
            background-color: var(--sap-sidebar-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            overflow-y: auto;
            padding: 8px 0;
            position: relative;
        }

        /* RESIZER BAR (DRAG TO RESIZE PANEL) */
        .sap-resizer {
            width: 5px;
            background-color: var(--sap-border-color);
            cursor: col-resize;
            height: 100%;
            z-index: 5;
            transition: background-color 0.2s ease;
        }

        .sap-resizer:hover, .sap-resizer.is-resizing {
            background-color: var(--sap-interactive-color);
        }

        .sap-tree-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .sap-tree-item {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sap-tree-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            gap: 6px;
            color: var(--sap-text-primary);
            white-space: nowrap;
        }

        .sap-tree-row:hover {
            background-color: var(--sap-tree-hover);
        }

        /* ICON PANAH TOGGLE */
        .sap-arrow-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: var(--sap-arrow-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .sap-tree-row.is-open .sap-arrow-icon {
            transform: rotate(90deg);
        }

        /* SVG FOLDER DUAL-LAYER */
        .sap-folder-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .folder-back { fill: var(--sap-folder-back); }
        .folder-front { fill: var(--sap-folder-front); }

        .folder-open-path { display: none; }
        .folder-closed-path { display: inline; }

        .sap-tree-row.is-open .folder-open-path { display: inline; }
        .sap-tree-row.is-open .folder-closed-path { display: none; }

        /* INDENTASI ANAK FOLDER */
        .sap-tree-children {
            list-style: none;
            display: none;
            padding-left: 20px;
            margin: 0;
        }

        .sap-tree-children.open {
            display: block;
        }

        /* 5. MAIN CONTENT CONTAINER */
        .sap-main-content-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 6. FOOTER STATUS BAR (SAP SIGNATURE BLUE THEME) */
        .sap-status-bar {
            height: 26px;
            background: var(--sap-statusbar-bg);
            border-top: 1px solid var(--sap-statusbar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-size: 11px;
            color: var(--sap-statusbar-text);
            user-select: none;
            z-index: 10;
        }

        .sap-status-message-area {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sap-status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2b7d2b; /* Indicator OK / Ready */
            flex-shrink: 0;
        }

        .sap-status-info-fields {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 100%;
        }

        .sap-status-field {
            background-color: var(--sap-statusbar-field-bg);
            border: 1px solid var(--sap-statusbar-field-border);
            padding: 2px 8px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Consolas, monospace;
            font-size: 11px;
            border-radius: 2px;
            color: var(--sap-statusbar-text);
        }

        .sap-status-field.system-id {
            font-weight: bold;
        }
    </style>
</head>

    <!-- JAVASCRIPT: THEME, FOLDER TOGGLE, & RESIZABLE SIDEBAR -->
    <script>
        // Switch Theme
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'light' ? '🌙' : '☀️';
            document.getElementById('themeText').textContent = newTheme === 'light' ? 'Dark' : 'Light';
        }

        // Expand / Collapse Folder
        function toggleFolder(element) {
            const children = element.nextElementSibling;
            
            if (children && children.classList.contains('sap-tree-children')) {
                children.classList.toggle('open');
                element.classList.toggle('is-open');
            }
        }

        // Resizable Sidebar Functionality
        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', function (e) {
            isResizing = true;
            resizer.classList.add('is-resizing');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function (e) {
            if (!isResizing) return;
            let newWidth = e.clientX - sidebar.getBoundingClientRect().left;
            
            // Batas minimal dan maksimal lebar panel
            if (newWidth >= 180 && newWidth <= 600) {
                sidebar.style.width = newWidth + 'px';
            }
        });

        document.addEventListener('mouseup', function () {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('is-resizing');
                document.body.style.cursor = 'default';
                document.body.style.userSelect = 'auto';
            }
        });
    </script>

</body>
