<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Business One</title>
    <style>
        /* --- VARIABEL WARNA (SAP Horizon Light & Dark) --- */
        [data-theme="light"] {
            --sap-background-color: #f5f6f7;
            --sap-shell-color: #ffffff;
            --sap-toolbar-color: #ffffff;
            --sap-sidebar-color: #ffffff;
            --sap-border-color: #d5dadd;
            --sap-text-primary: #223548;
            --sap-text-secondary: #5b738b;
            --sap-interactive-color: #0070f2;
            --sap-btn-hover: #f0f2f4;
            --sap-tree-hover: #eaf3fc;
            --sap-tree-selected: #d0e5fa;
            --sap-folder-icon: #f4b400; /* Warna Kuning SAP */
        }

        [data-theme="dark"] {
            --sap-background-color: #12171c;
            --sap-shell-color: #1d232a;
            --sap-toolbar-color: #1d232a;
            --sap-sidebar-color: #181e24;
            --sap-border-color: #2e3742;
            --sap-text-primary: #f5f6f7;
            --sap-text-secondary: #899eb3;
            --sap-interactive-color: #4db2ff;
            --sap-btn-hover: #2a333d;
            --sap-tree-hover: #25313d;
            --sap-tree-selected: #1d3954;
            --sap-folder-icon: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background-color: var(--sap-background-color);
            color: var(--sap-text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
        }

        /* 1. HEADER CONTAINER */
        .sap-header-container {
            background-color: var(--sap-shell-color);
            height: 48px;
            border-bottom: 1px solid var(--sap-border-color);
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .sap-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            color: var(--sap-text-primary);
        }

        .sap-header-brand span {
            color: var(--sap-interactive-color);
        }

        .sap-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-switch-btn {
            background: none;
            border: 1px solid var(--sap-border-color);
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            color: var(--sap-text-primary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-switch-btn:hover {
            background-color: var(--sap-btn-hover);
        }

        .sap-user-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--sap-interactive-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        /* 2. MENU BAR CONTAINER */
        .sap-menu-bar-container {
            background-color: var(--sap-toolbar-color);
            height: 36px;
            border-bottom: 1px solid var(--sap-border-color);
            width: 100%;
        }

        /* 3. BODY CONTAINER */
        .sap-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
        }

        /* 4. SIDEBAR CONTAINER (SAP MENU PANEL) */
        .sap-sidebar-container {
            width: 280px;
            background-color: var(--sap-sidebar-color);
            border-right: 1px solid var(--sap-border-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            overflow-y: auto;
            padding: 8px 0;
        }

        /* SAP TREE MENU STYLES BERSIH (TANPA DOT/BULAT) */
        .sap-tree-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .sap-tree-item {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sap-tree-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            gap: 8px;
            color: var(--sap-text-primary);
        }

        .sap-tree-row:hover {
            background-color: var(--sap-tree-hover);
        }

        /* SVG FOLDER ICON & PATH SWITCH */
        .sap-folder-icon {
            width: 18px;
            height: 18px;
            fill: var(--sap-folder-icon);
            flex-shrink: 0;
        }

        .folder-open-path { display: none; }
        .folder-closed-path { display: inline; }

        .sap-tree-row.is-open .folder-open-path { display: inline; }
        .sap-tree-row.is-open .folder-closed-path { display: none; }

        /* INDENTASI ANAK FOLDER (TIDAK ADA BULAT/DOT) */
        .sap-tree-children {
            list-style: none;
            display: none;
            padding-left: 18px;
            margin: 0;
        }

        .sap-tree-children.open {
            display: block;
        }

        /* 5. MAIN CONTENT CONTAINER */
        .sap-main-content-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- 1. Header Container -->
    <header class="sap-header-container">
        <div class="sap-header-brand">
            <span>Ananta</span> Business One
        </div>

        <div class="sap-header-controls">
            <button class="theme-switch-btn" id="themeToggle" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
            </button>
            <button class="sap-user-icon" title="Profil Pengguna">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>
    </header>

    <!-- 2. Menu Bar Container -->
    <nav class="sap-menu-bar-container"></nav>

    <!-- 3. Body Container -->
    <div class="sap-body-container">
        
        <!-- 4. Sidebar Container (SAP Menu Panel) -->
        <aside class="sap-sidebar-container">
            <ul class="sap-tree-list">
                
                <!-- ROOT 1: FAVORITES (DOUBLE KLIK UNTUK BUKA/TUTUP) -->
                <li class="sap-tree-item">
                    <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                        <svg class="sap-folder-icon" viewBox="0 0 24 24">
                            <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                            <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                        </svg>
                        <span>Favorites</span>
                    </div>
                    <ul class="sap-tree-children">
                        <!-- Kosong -->
                    </ul>
                </li>

                <!-- ROOT 2: MODULES (DEFAULT OPEN, DOUBLE KLIK UNTUK BUKA/TUTUP) -->
                <li class="sap-tree-item">
                    <div class="sap-tree-row is-open" ondblclick="toggleFolder(this)">
                        <svg class="sap-folder-icon" viewBox="0 0 24 24">
                            <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                            <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                        </svg>
                        <span>Modules</span>
                    </div>
                    <ul class="sap-tree-children open">
                        
                        <!-- Sub-Folder 1: Office -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                                <svg class="sap-folder-icon" viewBox="0 0 24 24">
                                    <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                    <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                                </svg>
                                <span>Office</span>
                            </div>
                            <ul class="sap-tree-children"></ul>
                        </li>

                        <!-- Sub-Folder 2: Accounting -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                                <svg class="sap-folder-icon" viewBox="0 0 24 24">
                                    <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                    <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                                </svg>
                                <span>Accounting</span>
                            </div>
                            <ul class="sap-tree-children"></ul>
                        </li>

                        <!-- Sub-Folder 3: Logistic -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                                <svg class="sap-folder-icon" viewBox="0 0 24 24">
                                    <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                    <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                                </svg>
                                <span>Logistic</span>
                            </div>
                            <ul class="sap-tree-children"></ul>
                        </li>

                        <!-- Sub-Folder 4: HR -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                                <svg class="sap-folder-icon" viewBox="0 0 24 24">
                                    <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                    <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                                </svg>
                                <span>HR</span>
                            </div>
                            <ul class="sap-tree-children"></ul>
                        </li>

                        <!-- Sub-Folder 5: Tools -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                                <svg class="sap-folder-icon" viewBox="0 0 24 24">
                                    <path class="folder-closed-path" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                    <path class="folder-open-path" d="M19 20H5c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h5l2 2h7c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM5 8v10h14V8H5z"/>
                                </svg>
                                <span>Tools</span>
                            </div>
                            <ul class="sap-tree-children"></ul>
                        </li>

                    </ul>
                </li>

            </ul>
        </aside>

        <!-- 5. Main Content Container -->
        <main class="sap-main-content-container"></main>

    </div>

    <!-- JAVASCRIPT: TOGGLE THEME & DOUBLE CLICK FOLDER EXPAND/COLLAPSE -->
    <script>
        // Switch Theme (Light/Dark)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'light' ? '🌙' : '☀️';
            document.getElementById('themeText').textContent = newTheme === 'light' ? 'Dark' : 'Light';
        }

        // Double Click Handler untuk Expand/Collapse Folder
        function toggleFolder(element) {
            const children = element.nextElementSibling;
            
            if (children && children.classList.contains('sap-tree-children')) {
                children.classList.toggle('open');
                element.classList.toggle('is-open');
            }
        }
    </script>

</body>
</html>
