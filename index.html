<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 11 Style Floating Panel with AppsScript Integration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: ButtonFace;
      font-family: "Segoe UI Variable Text", "Segoe UI", Tahoma, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Prevent Select All During Resize/Drag */
    body.resizing-active, 
    body.resizing-active * {
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
    }

    /* Taskbar Container */
    #taskbar-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      z-index: 9999;
    }

    /* Floating Window Structure */
    .window {
      position: absolute;
      background: #ece7f8;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: top 0.2s ease, left 0.2s ease, width 0.2s ease, height 0.2s ease, border-radius 0.2s ease;
    }

    .window.dragging, .window.resizing {
      transition: none !important;
    }

    /* Window Sizes */
    #loginWindow {
      top: 20%;
      left: 35%;
      width: 360px;
      height: 440px;
      min-width: 300px;
      min-height: 320px;
      z-index: 100;
    }

    #homeWindow {
      top: 15%;
      left: 25%;
      width: 520px;
      height: 420px;
      min-width: 360px;
      min-height: 250px;
      display: none;
      z-index: 101;
    }

    /* Resize Handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }

    .resize-handle.top    { top: 0; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
    .resize-handle.bottom { bottom: 0; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
    .resize-handle.left   { top: 8px; bottom: 8px; left: 0; width: 6px; cursor: ew-resize; }
    .resize-handle.right  { top: 8px; bottom: 8px; right: 0; width: 6px; cursor: ew-resize; }

    .resize-handle.top-left     { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .resize-handle.top-right    { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-handle.bottom-left  { bottom: 0; left: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-handle.bottom-right { bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; }

    /* Window Header */
    .window-header {
      height: 44px;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 12px;
      position: relative;
    }

    .window-title {
      font-size: 13px;
      font-weight: 500;
      color: #1c1b1f;
      cursor: move;
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Custom Header User Badge for HOME Panel */
    .user-header-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 20px;
      transition: background-color 0.2s ease;
    }

    .user-header-badge:hover {
      background-color: rgba(0, 0, 0, 0.06);
    }

    .user-avatar-small {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(0,0,0,0.15);
      background-color: #ffd166;
    }

    .user-header-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.1;
    }

    .user-display-name {
      font-size: 12px;
      font-weight: 600;
      color: #1c1b1f;
    }

    .user-handle-name {
      font-size: 10px;
      color: #666;
      font-family: monospace;
    }

    /* Control Buttons */
    .win-controls {
      display: flex;
      height: 100%;
      align-items: center;
      z-index: 11;
    }

    .win-btn {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .win-btn svg {
      width: 12px;
      height: 12px;
      stroke: #1c1b1f;
      stroke-width: 1.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .win-btn:hover { background-color: rgba(0, 0, 0, 0.06); }
    .win-btn.close-btn:hover { background-color: #c42b1c; }
    .win-btn.close-btn:hover svg { stroke: #ffffff; }
    .win-btn.close-btn { border-top-right-radius: 12px; }
    .win-btn.logout-btn:hover { background-color: rgba(196, 43, 28, 0.1); }
    .win-btn.logout-btn svg { stroke: #c42b1c; }

    /* Window Body */
    .window-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
      background: #fcfbfe;
      margin: 0 8px 8px 8px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      position: relative;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #1a1a1a;
      text-align: center;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444;
    }

    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #c5c5c5;
      border-bottom: 2px solid #757575;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      background-color: #ffffff;
    }

    .form-group input:focus { border-bottom-color: #005fb8; }

    .btn-submit {
      width: 100%;
      padding: 9px;
      background: #005fb8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit:hover { background: #004e98; }
    #error-message {
      color: #c42b1c;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      min-height: 16px;
    }

    /* Floating Capsule Button (+ Home) */
    #openHomeBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      border-radius: 50px;
      background: #005fb8;
      color: #ffffff;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      display: none;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
      z-index: 50;
      user-select: none;
    }

    #openHomeBtn:hover {
      background: #004e98;
      transform: translate(-50%, -50%) scale(1.05);
    }

    #openHomeBtn svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
    }

    /* Hugging Face Style Popup Profile Card */
    #hfProfileCard {
      position: absolute;
      top: 48px;
      left: 12px;
      width: 310px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(0,0,0,0.08);
      overflow: hidden;
      display: none;
      z-index: 2000;
      animation: fadeInPopup 0.2s ease-out forwards;
    }

    @keyframes fadeInPopup {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hf-banner {
      height: 70px;
      background: linear-gradient(135deg, #fce38a 0%, #38302e 100%);
    }

    .hf-body {
      padding: 0 16px 16px 16px;
      position: relative;
    }

    .hf-avatar-wrapper {
      position: relative;
      margin-top: -36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .hf-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      object-fit: cover;
      background-color: #ffd166;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .hf-like-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: background 0.15s ease;
    }

    .hf-like-btn:hover { background: #f9fafb; }
    .hf-like-btn svg { width: 14px; height: 14px; fill: #ef4444; }

    .hf-display-name {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      line-height: 1.2;
    }

    .hf-username-tag {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
    }

    /* Minimized Style */
    .window.minimized {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      width: 220px !important;
      height: 40px !important;
      min-height: 40px !important;
      border-radius: 8px;
    }

    .window.minimized .window-body,
    .window.minimized .resize-handle,
    .window.minimized #hfProfileCard {
      display: none !important;
    }

    /* Maximized Style */
    .window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0;
    }

    .window.maximized .resize-handle { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. LOGIN PANEL WINDOW -->
  <div class="window" id="loginWindow">
    <div class="resize-handle top"></div>
    <div class="resize-handle bottom"></div>
    <div class="resize-handle left"></div>
    <div class="resize-handle right"></div>
    <div class="resize-handle top-left"></div>
    <div class="resize-handle top-right"></div>
    <div class="resize-handle bottom-left"></div>
    <div class="resize-handle bottom-right"></div>

    <div class="window-header">
      <div class="window-title" ondragstart="return false;">Login Panel</div>
      <div class="win-controls">
        <button class="win-btn btn-minimize" title="Minimize"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
        <button class="win-btn btn-maximize" title="Maximize"><svg viewBox="0 0 12 12" class="icon-max"><rect x="1.5" y="1.5" width="9" height="9" rx="2"/></svg></button>
        <button class="win-btn close-btn btn-close" title="Close"><svg viewBox="0 0 12 12"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5"/></svg></button>

        <button type="submit" class="btn-submit" id="btnLogin">Masuk</button>
        <div id="error-message"></div>
      </form>
    </div>
  </div>

  <!-- 2. HOME WINDOW PANEL -->
  <div class="window" id="homeWindow">
    <div class="resize-handle top"></div>
    <div class="resize-handle bottom"></div>
    <div class="resize-handle left"></div>
    <div class="resize-handle right"></div>
    <div class="resize-handle top-left"></div>
    <div class="resize-handle top-right"></div>
    <div class="resize-handle bottom-left"></div>
    <div class="resize-handle bottom-right"></div>

    <div class="window-header">
      <!-- Header Diganti Dengan Profile Badge -->
      <div class="window-title" id="homeHeaderTitle" ondragstart="return false;">
        <div class="user-header-badge" id="userBadgeToggle">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=AntIllustrious" alt="User Avatar" class="user-avatar-small" id="headerAvatarImg">
          <div class="user-header-info">
            <span class="user-display-name" id="headerDisplayName">Bayu Adi Ananta</span>
            <span class="user-handle-name" id="headerUsername">@AnantaXLLustrious</span>
          </div>
        </div>
      </div>

      <div class="win-controls">
        <button class="win-btn logout-btn" id="btnLogout" title="Logout">
          <svg viewBox="0 0 12 12">
            <path d="M 4.5 1.5 L 2 1.5 C 1.5 1.5 1 2 1 2.5 L 1 9.5 C 1 10 1.5 10.5 2 10.5 L 4.5 10.5" />
            <line x1="5.5" y1="6" x2="11" y2="6" />
            <polyline points="8.5 3.5 11 6 8.5 8.5" />
          </svg>
        </button>
        <button class="win-btn btn-minimize" title="Minimize"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
        <button class="win-btn btn-maximize" title="Maximize"><svg viewBox="0 0 12 12" class="icon-max"><rect x="1.5" y="1.5" width="9" height="9" rx="2"/></svg></button>
        <button class="win-btn close-btn btn-close" title="Close"><svg viewBox="0 0 12 12"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5"/></svg></button>
      </div>

      <!-- Hugging Face Popup Card -->
      <div id="hfProfileCard">
        <div class="hf-banner"></div>
        <div class="hf-body">
          <div class="hf-avatar-wrapper">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=AntIllustrious" alt="Avatar" class="hf-avatar" id="cardAvatarImg">
            <button class="hf-like-btn" id="btnLikeCard">
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span id="likeCount">1</span>
            </button>
          </div>
          <div class="hf-display-name" id="cardDisplayName">AntIllustrious</div>
          <div class="hf-username-tag" id="cardUsernameTag">AnantaXLIllustrious</div>
        </div>
      </div>
    </div>

    <div class="window-body">
      <!-- Area Konten Utama -->
    </div>
  </div>

  <!-- Tombol Kapsul Home -->
  <button id="openHomeBtn" title="Buka Window HOME">
    <svg viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    <span>Home</span>
  </button>

  <div id="taskbar-container"></div>

  <script>
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwARJAXmtGqvlV4-oicW_HBUiBz_JvYHxLMjl23LoxtFOSvAk0EUxpYIJvPC_OYaI0n/exec";

    const iconMaximizeSVG = `<rect x="1.5" y="1.5" width="9" height="9" rx="2" />`;
    const iconRestoreSVG = `
      <rect x="3.5" y="1.5" width="7" height="7" rx="1.5" />
      <rect x="1.5" y="3.5" width="7" height="7" rx="1.5" style="fill: #ece7f8;" />
    `;

    let activeZIndex = 100;

    // --- WINDOW CONTROLS LOGIC ---
    document.querySelectorAll('.window').forEach(win => {
      const header = win.querySelector('.window-title');
      const btnMin = win.querySelector('.btn-minimize');
      const btnMax = win.querySelector('.btn-maximize');
      const btnClose = win.querySelector('.btn-close');
      const iconMax = win.querySelector('.icon-max');

      let prevRect = {};
      let isMaximized = false;
      let isMinimized = false;

      win.addEventListener('mousedown', () => {
        activeZIndex++;
        win.style.zIndex = activeZIndex;
      });

      // DRAG LOGIC
      let isDragging = false;
      let offsetX = 0, offsetY = 0;

      header.addEventListener('mousedown', (e) => {
        if (isMaximized || isMinimized) return;
        if (e.target.closest('#userBadgeToggle') || e.target.closest('#hfProfileCard')) return;

        e.preventDefault();
        document.body.classList.add('resizing-active');

        isDragging = true;
        win.classList.add('dragging');
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let newX = e.clientX - offsetX;
        let newY = e.clientY - offsetY;

        const maxX = window.innerWidth - win.offsetWidth;
        const maxY = window.innerHeight - win.offsetHeight;

        win.style.left = `${Math.max(0, Math.min(newX, maxX))}px`;
        win.style.top = `${Math.max(0, Math.min(newY, maxY))}px`;
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          win.classList.remove('dragging');
          document.body.classList.remove('resizing-active');
        }
      });

      function saveCurrentState() {
        if (!isMaximized && !isMinimized) {
          prevRect = {
            top: win.style.top || win.offsetTop + "px",
            left: win.style.left || win.offsetLeft + "px",
            width: win.style.width || win.offsetWidth + "px",
            height: win.style.height || win.offsetHeight + "px"
          };
        }
      }

      function minimizeWindow() {
        if (isMinimized) {
          restoreWindow();
          return;
        }
        saveCurrentState();
        isMinimized = true;
        isMaximized = false;
        win.classList.remove('maximized');
        win.classList.add('minimized');
        document.getElementById('taskbar-container').appendChild(win);
        iconMax.innerHTML = iconMaximizeSVG;
      }

      function restoreWindow() {
        if (!isMinimized) return;
        isMinimized = false;
        win.classList.remove('minimized');
        document.body.appendChild(win);
        win.style.top = prevRect.top;
        win.style.left = prevRect.left;
        win.style.width = prevRect.width;
        win.style.height = prevRect.height;
      }

      function toggleMaximize() {
        if (isMinimized) restoreWindow();

        if (isMaximized) {
          win.classList.remove('maximized');
          win.style.top = prevRect.top;
          win.style.left = prevRect.left;
          win.style.width = prevRect.width;
          win.style.height = prevRect.height;
          iconMax.innerHTML = iconMaximizeSVG;
          isMaximized = false;
        } else {
          saveCurrentState();
          win.classList.add('maximized');
          iconMax.innerHTML = iconRestoreSVG;
          isMaximized = true;
        }
      }

      btnMin.addEventListener('click', minimizeWindow);
      btnMax.addEventListener('click', toggleMaximize);

      btnClose.addEventListener('click', () => {
        if (win.id === 'loginWindow') {
          minimizeWindow();
        } else if (win.id === 'homeWindow') {
          win.style.display = 'none';
          document.getElementById('openHomeBtn').style.display = 'flex';
          document.getElementById('hfProfileCard').style.display = 'none';
        }
      });

      header.addEventListener('click', (e) => {
        if (isMinimized && !e.target.closest('#userBadgeToggle')) restoreWindow();
      });

      // RESIZE LOGIC
      let isResizing = false;
      let currentHandle = null;
      let startX = 0, startY = 0;
      let startW = 0, startH = 0, startL = 0, startT = 0;
      const minW = parseInt(win.style.minWidth) || 280;
      const minH = parseInt(win.style.minHeight) || 200;

      win.querySelectorAll('.resize-handle').forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
          if (isMaximized || isMinimized) return;
          e.preventDefault();
          e.stopPropagation();

          document.body.classList.add('resizing-active');
          window.getSelection()?.removeAllRanges();

          isResizing = true;
          currentHandle = handle;
          win.classList.add('resizing');

          startX = e.clientX;
          startY = e.clientY;
          startW = win.offsetWidth;
          startH = win.offsetHeight;
          startL = win.offsetLeft;
          startT = win.offsetTop;
        });
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing || !currentHandle) return;
        window.getSelection()?.removeAllRanges();

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        let newW = startW, newH = startH, newL = startL, newT = startT;

        if (currentHandle.classList.contains("right") || currentHandle.classList.contains("top-right") || currentHandle.classList.contains("bottom-right")) {
          newW = Math.max(minW, startW + dx);
        }
        if (currentHandle.classList.contains("bottom") || currentHandle.classList.contains("bottom-left") || currentHandle.classList.contains("bottom-right")) {
          newH = Math.max(minH, startH + dy);
        }
        if (currentHandle.classList.contains("left") || currentHandle.classList.contains("top-left") || currentHandle.classList.contains("bottom-left")) {
          if (startW - dx >= minW) { newW = startW - dx; newL = startL + dx; }
        }
        if (currentHandle.classList.contains("top") || currentHandle.classList.contains("top-left") || currentHandle.classList.contains("top-right")) {
          if (startH - dy >= minH) { newH = startH - dy; newT = startT + dy; }
        }

        win.style.width = `${newW}px`;
        win.style.height = `${newH}px`;
        win.style.left = `${newL}px`;
        win.style.top = `${newT}px`;
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          currentHandle = null;
          win.classList.remove('resizing');
          document.body.classList.remove('resizing-active');
        }
      });
    });

    // --- ELEMENTS ---
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const errorMessage = document.getElementById('error-message');
    const loginWindow = document.getElementById('loginWindow');
    const homeWindow = document.getElementById('homeWindow');
    const openHomeBtn = document.getElementById('openHomeBtn');
    const btnLogout = document.getElementById('btnLogout');

    const userBadgeToggle = document.getElementById('userBadgeToggle');
    const hfProfileCard = document.getElementById('hfProfileCard');
    const headerDisplayName = document.getElementById('headerDisplayName');
    const headerUsername = document.getElementById('headerUsername');
    const headerAvatarImg = document.getElementById('headerAvatarImg');

    const cardDisplayName = document.getElementById('cardDisplayName');
    const cardUsernameTag = document.getElementById('cardUsernameTag');
    const cardAvatarImg = document.getElementById('cardAvatarImg');
    const btnLikeCard = document.getElementById('btnLikeCard');
    const likeCount = document.getElementById('likeCount');

    let likes = 1;

    // --- POPUP CARD TOGGLE ---
    userBadgeToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = hfProfileCard.style.display === 'block';
      hfProfileCard.style.display = isVisible ? 'none' : 'block';
    });

    // Tutup popup jika klik di luar area profil
    document.addEventListener('click', (e) => {
      if (!hfProfileCard.contains(e.target) && !userBadgeToggle.contains(e.target)) {
        hfProfileCard.style.display = 'none';
      }
    });

    // Interaksi Like Counter
    btnLikeCard.addEventListener('click', (e) => {
      e.stopPropagation();
      likes++;
      likeCount.innerText = likes;
    });

    // --- UPDATE PROFIL USER ---
    function updateUserData(displayName, username) {
      const uname = username || 'User';
      const dName = displayName || uname;
      const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(uname)}`;

      headerDisplayName.innerText = dName;
      headerUsername.innerText = `@${uname}`;
      headerAvatarImg.src = avatarUrl;

      cardDisplayName.innerText = dName;
      cardUsernameTag.innerText = uname;
      cardAvatarImg.src = avatarUrl;
    }

    function showHomeWindow(displayName, username) {
      loginWindow.style.display = 'none';
      homeWindow.style.display = 'flex';
      openHomeBtn.style.display = 'none';
      activeZIndex++;
      homeWindow.style.zIndex = activeZIndex;

      updateUserData(displayName, username);
    }

    // --- CHECK SESSION LOCALSTORAGE ---
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('userSession');
      if (savedUser) {
        const userData = JSON.parse(savedUser);
        showHomeWindow(userData.displayName, userData.username);
      }
    });

    // --- SUBMIT LOGIN ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();
      const mathToken = userVal + passVal;

      errorMessage.style.color = '#005fb8';
      errorMessage.innerText = 'Memeriksa kredensial...';
      btnLogin.disabled = true;

      try {
        const response = await fetch(`${APP_SCRIPT_URL}?token=${encodeURIComponent(mathToken)}`);
        const result = await response.json();

        if (result.success) {
          errorMessage.innerText = '';
          const fullName = [result.user.firstName, result.user.lastName].filter(Boolean).join(' ') || userVal;
          
          localStorage.setItem('userSession', JSON.stringify({
            username: userVal,
            displayName: fullName
          }));

          showHomeWindow(fullName, userVal);
        } else {
          errorMessage.style.color = '#c42b1c';
          errorMessage.innerText = result.message || 'Username atau Password salah.';
        }
      } catch (err) {
        errorMessage.style.color = '#c42b1c';
        errorMessage.innerText = 'Gagal terhubung ke Google Sheets API.';
        console.error(err);
      } finally {
        btnLogin.disabled = false;
      }
    });

    // --- OPEN HOME FROM CAPSULE BUTTON ---
    openHomeBtn.addEventListener('click', () => {
      homeWindow.style.display = 'flex';
      openHomeBtn.style.display = 'none';
      activeZIndex++;
      homeWindow.style.zIndex = activeZIndex;
    });

    // --- LOGOUT ---
    btnLogout.addEventListener('click', () => {
      localStorage.removeItem('userSession');

      homeWindow.style.display = 'none';
      openHomeBtn.style.display = 'none';
      hfProfileCard.style.display = 'none';

      loginWindow.style.display = 'flex';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      errorMessage.innerText = '';
      activeZIndex++;
      loginWindow.style.zIndex = activeZIndex;
    });
  </script>

</body>
</html>
