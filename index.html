<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Shell</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Container Kiri */
        #left-container {
            width: 300px;
            height: 100%;
            border-right: 1px solid #d0d0d0;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        /* Header Kiri dengan Icon Action */
        #left-header {
            height: 60px;
            border-bottom: 1px solid #d0d0d0;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        /* Styling Icon Action */
        .action-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            object-fit: contain;
        }

        #file-list {
            flex: 1;
            overflow-y: auto;
        }

        /* Container Kanan (Polos) */
        #right-container {
            flex: 1;
            height: 100%;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Container Kiri -->
    <div id="left-container">
        <div id="left-header">
            <!-- Icon Action Pojok Kiri Atas (Raw GitHub URL) -->
            <img src="https://raw.githubusercontent.com/anantaiqqi-beep/INSTRUCT-PART/b64e616a85485b020a9f3aaa8279ef745e41a39e/icon/system_menu.bmp" alt="Action Menu" class="action-icon">
        </div>
        <div id="file-list"></div>
    </div>

    <!-- Container Kanan -->
    <div id="right-container">
        <iframe id="content-frame" name="content-frame" src="about:blank"></iframe>
    </div>

</body>
</html>
