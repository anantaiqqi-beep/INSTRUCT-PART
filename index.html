<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaya UI SAP Business One (White Theme) - Container Only</title>
    <style>
        /* --- VARIABEL WARNA (SAP Horizon Light) --- */
        :root {
            --sap-background-color: #f5f6f7;
            --sap-shell-color: #ffffff;
            --sap-toolbar-color: #ffffff;
            --sap-sidebar-color: #ffffff;
            --sap-border-color: #d5dadd;
            --sap-font-family: "72", "72full", Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* CONTAINER UTAMA / ROOT CONTAINER */
        body {
            font-family: var(--sap-font-family);
            background-color: var(--sap-background-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. CONTAINER HEADER (SHELL) */
        .sap-header-container {
            background-color: var(--sap-shell-color);
            height: 48px;
            border-bottom: 1px solid var(--sap-border-color);
            z-index: 10;
            width: 100%;
        }

        /* 2. CONTAINER MENU BAR / TOOLBAR */
        .sap-menu-bar-container {
            background-color: var(--sap-toolbar-color);
            height: 36px;
            border-bottom: 1px solid var(--sap-border-color);
            width: 100%;
        }

        /* 3. CONTAINER BODY (Samping-sampingan untuk Sidebar + Main Content) */
        .sap-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
        }

        /* 4. CONTAINER SIDEBAR NAVIGASI */
        .sap-sidebar-container {
            width: 260px;
            background-color: var(--sap-sidebar-color);
            border-right: 1px solid var(--sap-border-color);
            overflow-y: auto;
        }

        /* 5. CONTAINER MAIN CONTENT */
        .sap-main-content-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- 1. Header Container -->
    <header class="sap-header-container"></header>

    <!-- 2. Menu Bar Container -->
    <nav class="sap-menu-bar-container"></nav>

    <!-- 3. Body Container -->
    <div class="sap-body-container">
        
        <!-- 4. Sidebar Container -->
        <aside class="sap-sidebar-container"></aside>

        <!-- 5. Main Content Container -->
        <main class="sap-main-content-container"></main>

    </div>

</body>
</html>
