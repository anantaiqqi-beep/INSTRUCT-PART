<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Login Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Window Container */
    .window {
      position: absolute;
      top: 20%;
      left: 35%;
      width: 320px;
      height: 380px;
      min-width: 280px;
      min-height: 300px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      resize: both;
      overflow: hidden;
    }

    /* Window Header / Title Bar */
    .window-header {
      background: #2c3e50;
      color: #ffffff;
      padding: 10px 14px;
      cursor: move;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    /* Window Control Buttons */
    .window-controls {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .close-btn { background-color: #ff5f56; }
    .minimize-btn { background-color: #ffbd2e; }
    .maximize-btn { background-color: #27c93f; }

    /* Window Body / Content */
    .window-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .login-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #666;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #3498db;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>

  <!-- Floating Window Panel -->
  <div class="window" id="loginWindow">
    <div class="window-header" id="windowHeader">
      <span>Login</span>
      <div class="window-controls">
        <span class="control-btn minimize-btn"></span>
        <span class="control-btn maximize-btn"></span>
        <span class="control-btn close-btn"></span>
      </div>
    </div>
    <div class="window-body">
      <h2 class="login-title">Sign In</h2>
      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password">
        </div>
        <button type="submit" class="btn-submit">Masuk</button>
      </form>
    </div>
  </div>

  <script>
    // Drag / Move Functionality
    const windowPanel = document.getElementById("loginWindow");
    const windowHeader = document.getElementById("windowHeader");

    let isDragging = false;
    let offsetX = 0, offsetY = 0;

    windowHeader.addEventListener("mousedown", (e) => {
      isDragging = true;
      offsetX = e.clientX - windowPanel.offsetLeft;
      offsetY = e.clientY - windowPanel.offsetTop;
      document.body.style.userSelect = "none";
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      
      let newX = e.clientX - offsetX;
      let newY = e.clientY - offsetY;

      // Mencegah jendela keluar dari layar
      const maxX = window.innerWidth - windowPanel.offsetWidth;
      const maxY = window.innerHeight - windowPanel.offsetHeight;

      newX = Math.max(0, Math.min(newX, maxX));
      newY = Math.max(0, Math.min(newY, maxY));

      windowPanel.style.left = `${newX}px`;
      windowPanel.style.top = `${newY}px`;
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
      document.body.style.userSelect = "auto";
    });
  </script>

</body>
</html>
