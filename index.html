<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Business One</title>
    <style>
        [data-theme="light"] {
            --sap-background-color: #f5f6f7;
            --sap-shell-color: #ffffff;
            --sap-toolbar-color: #ffffff;
            --sap-sidebar-color: #ffffff;
            --sap-border-color: #d5dadd;
            --sap-text-primary: #223548;
            --sap-text-secondary: #5b738b;
            --sap-interactive-color: #0070f2;
            --sap-btn-hover: #f0f2f4;
            --sap-tree-hover: #eaf3fc;
            --sap-tree-selected: #d0e5fa;
            --sap-arrow-color: #6a6d70;
            --sap-dot-color: #0070f2;
            --sap-input-bg: #ffffff;
            --sap-input-border: #899eb3;
            --sap-table-header-bg: #eaeef2;
            --sap-table-row-hover: #f0f4f8;
            --sap-statusbar-bg: #ffffff;
            --sap-statusbar-border: #d5dadd;
            --sap-statusbar-text: #223548;
            --sap-card-bg: #ffffff;
            --sap-card-shadow: 0 6px 18px rgba(0,0,0,0.15);
            --sap-statusbar-field-bg: #f5f6f7;
            --sap-statusbar-field-border: #d5dadd;
            
            /* WARNA GARIS YANG SERAGAM UNTUK BORDER & LINE */
            --sap-form-line-border: #899eb3;
        }

        [data-theme="dark"] {
            --sap-background-color: #12171c;
            --sap-shell-color: #1d232a;
            --sap-toolbar-color: #1d232a;
            --sap-sidebar-color: #181e24;
            --sap-border-color: #2e3742;
            --sap-text-primary: #f5f6f7;
            --sap-text-secondary: #899eb3;
            --sap-interactive-color: #4db2ff;
            --sap-btn-hover: #2a333d;
            --sap-tree-hover: #25313d;
            --sap-tree-selected: #1d3954;
            --sap-arrow-color: #a2b4c7;
            --sap-dot-color: #4db2ff;
            --sap-input-bg: #12171c;
            --sap-input-border: #4d5d6d;
            --sap-table-header-bg: #222b35;
            --sap-table-row-hover: #1a232c;
            --sap-statusbar-bg: #1d232a;
            --sap-statusbar-border: #2e3742;
            --sap-statusbar-text: #f5f6f7;
            --sap-card-bg: #1d232a;
            --sap-card-shadow: 0 6px 18px rgba(0,0,0,0.5);
            --sap-statusbar-field-bg: #12171c;
            --sap-statusbar-field-border: #2e3742;
            
            /* WARNA GARIS YANG SERAGAM UNTUK DARK MODE */
            --sap-form-line-border: #4d5d6d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background-color: var(--sap-background-color);
            color: var(--sap-text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
        }

        /* OVERLAY LOGIN CONTAINER */
        .sap-login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--sap-background-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sap-login-card {
            width: 400px;
            background-color: var(--sap-shell-color);
            border: 1px solid var(--sap-border-color);
            border-radius: 6px;
            padding: 24px;
            box-shadow: var(--sap-card-shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sap-login-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: var(--sap-text-primary);
            margin-bottom: 8px;
        }

        .sap-login-title span {
            color: var(--sap-interactive-color);
        }

        /* MAIN SYSTEM DISPLAY */
        .sap-app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* HEADER CONTAINER */
        .sap-header-container {
            background-color: var(--sap-shell-color);
            height: 48px;
            border-bottom: 1px solid var(--sap-border-color);
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .sap-header-brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sap-header-brand {
            font-size: 15px;
            font-weight: bold;
            color: var(--sap-text-primary);
        }

        .sap-header-brand span {
            color: var(--sap-interactive-color);
        }

        .sap-header-divider {
            width: 1px;
            height: 18px;
            background-color: var(--sap-border-color);
        }

        .sap-screen-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--sap-text-primary);
        }

        .sap-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-switch-btn {
            background: none;
            border: 1px solid var(--sap-border-color);
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            color: var(--sap-text-primary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-switch-btn:hover {
            background-color: var(--sap-btn-hover);
        }

        .sap-user-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--sap-interactive-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        /* FUNCTION BAR CONTAINER */
        .sap-menu-bar-container {
            background-color: var(--sap-toolbar-color);
            height: 36px;
            border-bottom: 1px solid var(--sap-border-color);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        .sap-back-btn {
            background: none;
            border: none;
            color: var(--sap-interactive-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 4px;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .sap-back-btn:hover:not(:disabled) {
            background-color: var(--sap-btn-hover);
        }

        .sap-back-btn:disabled {
            color: var(--sap-border-color);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* BODY CONTAINER */
        .sap-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        /* SIDEBAR CONTAINER */
        .sap-sidebar-container {
            width: 280px;
            min-width: 180px;
            max-width: 600px;
            background-color: var(--sap-sidebar-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            overflow-y: auto;
            padding: 8px 0;
            position: relative;
        }

        .sap-resizer {
            width: 5px;
            background-color: var(--sap-border-color);
            cursor: col-resize;
            height: 100%;
            z-index: 5;
            transition: background-color 0.2s ease;
        }

        .sap-resizer:hover, .sap-resizer.is-resizing {
            background-color: var(--sap-interactive-color);
        }

        .sap-tree-list, .sap-tree-item {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sap-tree-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            gap: 8px;
            color: var(--sap-text-primary);
            white-space: nowrap;
        }

        .sap-tree-row:hover {
            background-color: var(--sap-tree-hover);
        }

        .sap-tree-row.selected {
            background-color: var(--sap-tree-selected);
            font-weight: 600;
        }

        .sap-arrow-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: var(--sap-arrow-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .sap-tree-row.is-open .sap-arrow-icon {
            transform: rotate(90deg);
        }

        .sap-dot-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sap-dot-icon::after {
            content: "";
            width: 6px;
            height: 6px;
            background-color: var(--sap-dot-color);
            border-radius: 50%;
        }

        .sap-tree-children {
            list-style: none;
            display: none;
            padding-left: 18px;
            margin: 0;
        }

        .sap-tree-children.open {
            display: block;
        }

        /* MAIN CONTENT CONTAINER */
        .sap-main-content-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* SAP GUI FORM WITH ALIGNED BOTTOM LINE & MATCHING COLORS */
        .sap-direct-form {
            width: 100%;
            max-width: 500px;
            background-color: var(--sap-shell-color);
            border: 1px solid var(--sap-border-color);
            border-radius: 4px;
            padding: 16px 20px;
        }

        .sap-form-group {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 4px 0 0 0;
            gap: 16px;
        }

        .sap-form-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--sap-text-primary);
            white-space: nowrap;
            flex: 1;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--sap-form-line-border); /* Garis sejajar dengan input */
        }

        .sap-form-label span {
            color: #d93b3b;
        }

        .sap-form-control-wrapper {
            display: flex;
            justify-content: flex-end;
        }

        .sap-form-control {
            height: 24px;
            padding: 2px 6px;
            border: 1px solid var(--sap-form-line-border); /* Warna border disamakan */
            border-radius: 2px;
            background-color: var(--sap-input-bg);
            color: var(--sap-text-primary);
            font-size: 12px;
            outline: none;
            width: 120px;
        }

        .sap-form-control:focus {
            border-color: var(--sap-interactive-color);
            box-shadow: 0 0 0 1px var(--sap-interactive-color);
        }

        textarea.sap-form-control {
            height: auto;
            resize: vertical;
        }

        .sap-form-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .sap-btn {
            height: 28px;
            padding: 0 16px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .sap-btn-primary {
            background-color: var(--sap-interactive-color);
            color: #ffffff;
        }

        .sap-btn-primary:hover:not(:disabled) {
            opacity: 0.9;
        }

        .sap-btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .sap-btn-secondary {
            background-color: transparent;
            border-color: var(--sap-border-color);
            color: var(--sap-text-primary);
        }

        .sap-btn-secondary:hover {
            background-color: var(--sap-btn-hover);
        }

        /* DATA GRID STYLES */
        .sap-grid-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sap-grid-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sap-grid-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--sap-text-secondary);
        }

        .sap-grid-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--sap-border-color);
            border-radius: 4px;
            background-color: var(--sap-shell-color);
        }

        .sap-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12px;
        }

        .sap-table th {
            background-color: var(--sap-table-header-bg);
            color: var(--sap-text-primary);
            font-weight: 600;
            padding: 10px 14px;
            border-bottom: 2px solid var(--sap-border-color);
            border-right: 1px solid var(--sap-border-color);
            white-space: nowrap;
        }

        .sap-table th:last-child {
            border-right: none;
        }

        .sap-table td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--sap-border-color);
            border-right: 1px solid var(--sap-border-color);
            color: var(--sap-text-primary);
            white-space: nowrap;
        }

        .sap-table td:last-child {
            border-right: none;
        }

        .sap-table tbody tr:hover {
            background-color: var(--sap-table-row-hover);
        }

        .sap-loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            gap: 12px;
            color: var(--sap-text-secondary);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--sap-border-color);
            border-top: 3px solid var(--sap-interactive-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* FOOTER STATUS BAR */
        .sap-status-bar-wrapper {
            position: relative;
            width: 100%;
            z-index: 10;
        }

        .sap-status-bar {
            height: 26px;
            background-color: var(--sap-statusbar-bg);
            border-top: 1px solid var(--sap-statusbar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            color: var(--sap-statusbar-text);
            user-select: none;
        }

        .sap-status-message-area {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sap-status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2b7d2b;
            flex-shrink: 0;
        }

        .sap-status-card {
            position: absolute;
            bottom: 32px;
            right: 12px;
            width: 200px;
            background-color: var(--sap-card-bg);
            border: 1px solid var(--sap-statusbar-border);
            border-radius: 4px;
            box-shadow: var(--sap-card-shadow);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            z-index: 20;
        }

        .sap-status-card.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .sap-status-field-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            background-color: var(--sap-statusbar-field-bg);
            border: 1px solid var(--sap-statusbar-field-border);
            border-radius: 3px;
        }

        .sap-status-label {
            font-size: 10px;
            color: var(--sap-text-secondary);
            font-weight: 500;
        }

        .sap-status-value {
            font-family: Consolas, monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--sap-statusbar-text);
        }

        .status-toggle-btn {
            background-color: var(--sap-statusbar-field-bg);
            border: 1px solid var(--sap-statusbar-field-border);
            border-radius: 3px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sap-text-primary);
        }
    </style>
</head>
<body>

    <!-- OVERLAY FORM LOGIN -->
    <div class="sap-login-overlay" id="loginOverlay">
        <form class="sap-login-card" id="loginForm" onsubmit="handleLogin(event)">
            <div class="sap-login-title">
                <span>Ananta</span> Business One
            </div>
            
            <div class="sap-form-group">
                <label class="sap-form-label" for="loginUsername">Username <span>*</span></label>
                <div class="sap-form-control-wrapper">
                    <input type="text" class="sap-form-control" id="loginUsername" required autocomplete="off" placeholder="" />
                </div>
            </div>

            <div class="sap-form-group">
                <label class="sap-form-label" for="loginPassword">Password <span>*</span></label>
                <div class="sap-form-control-wrapper">
                    <input type="password" class="sap-form-control" id="loginPassword" required placeholder="" />
                </div>
            </div>

            <button type="submit" class="sap-btn sap-btn-primary" id="loginBtn" style="width: 100%; margin-top: 10px; height: 32px;">Login System</button>
        </form>
    </div>

    <!-- UTAMA SYSTEM APP -->
    <div class="sap-app-container" id="appContainer" style="display: none;">
        
        <!-- Header Container -->
        <header class="sap-header-container">
            <div class="sap-header-brand-group">
                <div class="sap-header-brand">
                    <span>Ananta</span> Business One
                </div>
                
                <div class="sap-header-divider" id="headerDivider" style="display: none;"></div>
                <div class="sap-screen-title" id="screenTitle"></div>
            </div>

            <div class="sap-header-controls">
                <button class="theme-switch-btn" id="themeToggle" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
                </button>
                <button class="sap-user-icon" id="userIcon" title="Profil Pengguna" onclick="logout()">
                    U
                </button>
            </div>
        </header>

        <!-- Function Bar -->
        <nav class="sap-menu-bar-container">
            <button class="sap-back-btn" id="backBtn" disabled onclick="resetMainContent()" title="Kembali">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back</span>
            </button>
            <button class="sap-btn sap-btn-secondary" onclick="logout()" style="height: 24px; padding: 0 10px; font-size: 11px;">Logout</button>
        </nav>

        <!-- Body Container -->
        <div class="sap-body-container">
            
            <!-- Sidebar Container -->
            <aside class="sap-sidebar-container" id="sidebar">
                <ul class="sap-tree-list">
                    <li class="sap-tree-item">
                        <div class="sap-tree-row" ondblclick="toggleFolder(this)">
                            <svg class="sap-arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            <span>Favorites</span>
                        </div>
                        <ul class="sap-tree-children"></ul>
                    </li>

                    <li class="sap-tree-item">
                        <div class="sap-tree-row is-open" ondblclick="toggleFolder(this)">
                            <svg class="sap-arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            <span>Modules</span>
                        </div>
                        <ul class="sap-tree-children open">
                            <li class="sap-tree-item">
                                <div class="sap-tree-row is-open" ondblclick="toggleFolder(this)">
                                    <svg class="sap-arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                    <span>Logistic</span>
                                </div>
                                <ul class="sap-tree-children open">
                                    <li class="sap-tree-item">
                                        <div class="sap-tree-row is-open" ondblclick="toggleFolder(this)">
                                            <svg class="sap-arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                            <span>Master Data</span>
                                        </div>
                                        <ul class="sap-tree-children open">
                                            <li class="sap-tree-item">
                                                <div class="sap-tree-row is-open" ondblclick="toggleFolder(this)">
                                                    <svg class="sap-arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                                    <span>Warehouse</span>
                                                </div>
                                                <ul class="sap-tree-children open">
                                                    
                                                    <li class="sap-tree-item">
                                                        <div class="sap-tree-row" id="menuDataWarehouse" onclick="loadDataWarehouseGrid(this)">
                                                            <span class="sap-dot-icon"></span>
                                                            <span>Data Warehouse</span>
                                                        </div>
                                                    </li>

                                                    <li class="sap-tree-item">
                                                        <div class="sap-tree-row" onclick="openCreateWarehouseForm(this)">
                                                            <span class="sap-dot-icon"></span>
                                                            <span>Create Warehouse</span>
                                                        </div>
                                                    </li>

                                                </ul>
                                            </li>
                                        </ul>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                </ul>
            </aside>

            <div class="sap-resizer" id="resizer"></div>

            <!-- Main Content Container -->
            <main class="sap-main-content-container" id="mainContent"></main>

        </div>

        <!-- Footer Status Bar -->
        <div class="sap-status-bar-wrapper">
            <div class="sap-status-card" id="statusCard">
                <div class="sap-status-field-item"><span class="sap-status-label">System</span><span class="sap-status-value">PRD</span></div>
                <div class="sap-status-field-item"><span class="sap-status-label">Client</span><span class="sap-status-value">100</span></div>
                <div class="sap-status-field-item"><span class="sap-status-label">User</span><span class="sap-status-value" id="statusUserVal">-</span></div>
                <div class="sap-status-field-item"><span class="sap-status-label">MATH Var</span><span class="sap-status-value" id="statusMathVal" style="font-size:9px;">-</span></div>
            </div>

            <footer class="sap-status-bar">
                <div class="sap-status-message-area">
                    <span class="sap-status-icon"></span>
                    <span id="statusText">Ready</span>
                </div>

                <button class="status-toggle-btn" id="statusToggleBtn" onclick="toggleStatusCard()" title="Info Sistem">
                    <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
                </button>
            </footer>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwARJAXmtGqvlV4-oicW_HBUiBz_JvYHxLMjl23LoxtFOSvAk0EUxpYIJvPC_OYaI0n/exec";

        // Global State Variables
        let MATH = ""; 
        let activeUser = "";
        let idleTimer = null;
        const TIMEOUT_LIMIT = 15 * 60 * 1000;

        // --- LOGIN & VALIDASI MATH ---
        function handleLogin(e) {
            e.preventDefault();
            const userIn = document.getElementById('loginUsername').value.trim();
            const passIn = document.getElementById('loginPassword').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';

            MATH = userIn + passIn;

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: "login",
                    username: userIn,
                    password: passIn
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    activeUser = data.username;
                    
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                    
                    document.getElementById('statusUserVal').textContent = activeUser.toUpperCase();
                    document.getElementById('statusMathVal').textContent = MATH;
                    document.getElementById('userIcon').textContent = activeUser.charAt(0).toUpperCase();

                    startIdleTimer();
                } else {
                    alert("Login Gagal: " + data.message);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login System';
                }
            })
            .catch(err => {
                alert("Terjadi kesalahan jaringan atau server.");
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login System';
            });
        }

        // --- TIMEOUT SYSTEM ---
        function startIdleTimer() {
            resetIdleTimer();
            window.onload = resetIdleTimer;
            window.onmousemove = resetIdleTimer;
            window.onmousedown = resetIdleTimer;
            window.ontouchstart = resetIdleTimer;
            window.onclick = resetIdleTimer;
            window.onkeydown = resetIdleTimer;
            window.addEventListener('scroll', resetIdleTimer, true);
        }

        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(autoLogout, TIMEOUT_LIMIT);
        }

        function autoLogout() {
            alert("Sesi Anda telah berakhir karena tidak ada aktivitas selama 15 menit.");
            logout();
        }

        function logout() {
            if (idleTimer) clearTimeout(idleTimer);
            MATH = "";
            activeUser = "";
            document.getElementById('loginUsername').value = "";
            document.getElementById('loginPassword').value = "";
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').textContent = 'Login System';

            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';
            resetMainContent();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'light' ? '🌙' : '☀️';
            document.getElementById('themeText').textContent = newTheme === 'light' ? 'Dark' : 'Light';
        }

        function toggleFolder(element) {
            const children = element.nextElementSibling;
            if (children && children.classList.contains('sap-tree-children')) {
                children.classList.toggle('open');
                element.classList.toggle('is-open');
            }
        }

        // --- FETCH & LOAD DATA WAREHOUSE (KOLOM A - G) ---
        function loadDataWarehouseGrid(element) {
            if (element) {
                document.querySelectorAll('.sap-tree-row').forEach(row => row.classList.remove('selected'));
                element.classList.add('selected');
            }

            document.getElementById('headerDivider').style.display = 'block';
            document.getElementById('screenTitle').textContent = 'Data Warehouse Master Data';
            document.getElementById('backBtn').disabled = false;

            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="sap-loading-spinner">
                    <div class="spinner"></div>
                    <span>Mengambil data dari Google Sheets WH_DATA...</span>
                </div>
            `;
            document.getElementById('statusText').textContent = 'Fetching data...';

            fetch(APPS_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        renderGridView(data.headers, data.rows);
                        document.getElementById('statusText').textContent = `Berhasil memuat ${data.rows.length} baris data.`;
                    } else {
                        mainContent.innerHTML = `<div style="color:#d93b3b; padding:16px;">Error: ${data.message}</div>`;
                        document.getElementById('statusText').textContent = 'Error loading data';
                    }
                })
                .catch(err => {
                    mainContent.innerHTML = `<div style="color:#d93b3b; padding:16px;">Gagal memuat data.</div>`;
                    document.getElementById('statusText').textContent = 'Connection error';
                });
        }

        function renderGridView(headers, rows) {
            const mainContent = document.getElementById('mainContent');
            let headerHTML = headers.map(h => `<th>${h || '-'}</th>`).join('');
            let rowsHTML = rows.map(row => {
                let colsHTML = row.map(col => `<td>${col !== null && col !== undefined ? col : ''}</td>`).join('');
                return `<tr>${colsHTML}</tr>`;
            }).join('');

            mainContent.innerHTML = `
                <div class="sap-grid-container">
                    <div class="sap-grid-toolbar">
                        <span class="sap-grid-title">Sheet: WH_DATA (Kolom A - G)</span>
                    </div>
                    <div class="sap-grid-wrapper">
                        <table class="sap-table">
                            <thead><tr>${headerHTML}</tr></thead>
                            <tbody>${rowsHTML.length > 0 ? rowsHTML : '<tr><td colspan="7" style="text-align:center;">Data Kosong</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- FORM CREATE WAREHOUSE (Garis Sejajar dengan Input & Warna Sama) ---
        function openCreateWarehouseForm(element) {
            document.querySelectorAll('.sap-tree-row').forEach(row => row.classList.remove('selected'));
            element.classList.add('selected');

            document.getElementById('headerDivider').style.display = 'block';
            document.getElementById('screenTitle').textContent = 'Create Warehouse Master Data';
            document.getElementById('backBtn').disabled = false;

            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <form class="sap-direct-form" id="createWhForm" onsubmit="submitCreateWarehouseForm(event)">
                    
                    <div class="sap-form-group">
                        <label class="sap-form-label" for="baseUnit">Base Unit of Measure <span>*</span></label>
                        <div class="sap-form-control-wrapper">
                            <input type="text" class="sap-form-control" id="baseUnit" value="PC" required />
                        </div>
                    </div>

                    <div class="sap-form-group">
                        <label class="sap-form-label" for="tempCond">Temp. conditions</label>
                        <div class="sap-form-control-wrapper">
                            <input type="text" class="sap-form-control" id="tempCond" />
                        </div>
                    </div>

                    <div class="sap-form-group">
                        <label class="sap-form-label" for="containerReq">Container reqmts</label>
                        <div class="sap-form-control-wrapper">
                            <input type="text" class="sap-form-control" id="containerReq" />
                        </div>
                    </div>

                    <div class="sap-form-actions">
                        <button type="button" class="sap-btn sap-btn-secondary" onclick="resetMainContent()">Cancel</button>
                        <button type="submit" class="sap-btn sap-btn-primary" id="saveBtn">Save Data</button>
                    </div>
                </form>
            `;

            document.getElementById('statusText').textContent = 'Create Warehouse Master Data Opened';
        }

        // --- SIMPAN WAREHOUSE KE APPS SCRIPT ---
        function submitCreateWarehouseForm(event) {
            event.preventDefault();

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            document.getElementById('statusText').textContent = 'Saving data to Google Sheets...';

            const payload = {
                baseUnit: document.getElementById('baseUnit').value,
                tempCond: document.getElementById('tempCond').value,
                containerReq: document.getElementById('containerReq').value,
                createdBy: activeUser || 'ANANTA'
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(res => {
                if (res.status === 'success') {
                    alert('Data Warehouse berhasil disimpan!');
                    const dataWhMenu = document.getElementById('menuDataWarehouse');
                    loadDataWarehouseGrid(dataWhMenu);
                } else {
                    alert('Gagal menyimpan data: ' + res.message);
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Data';
                }
            })
            .catch(err => {
                alert('Terjadi kesalahan koneksi.');
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Data';
            });
        }

        function resetMainContent() {
            document.getElementById('mainContent').innerHTML = '';
            document.getElementById('headerDivider').style.display = 'none';
            document.getElementById('screenTitle').textContent = '';
            document.getElementById('backBtn').disabled = true;
            document.querySelectorAll('.sap-tree-row').forEach(row => row.classList.remove('selected'));
            document.getElementById('statusText').textContent = 'Ready';
        }

        function toggleStatusCard() {
            const card = document.getElementById('statusCard');
            const btn = document.getElementById('statusToggleBtn');
            card.classList.toggle('show');
            btn.classList.toggle('active');
        }

        // Resizer Panel Logic
        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', function (e) {
            isResizing = true;
            resizer.classList.add('is-resizing');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function (e) {
            if (!isResizing) return;
            let newWidth = e.clientX - sidebar.getBoundingClientRect().left;
            if (newWidth >= 180 && newWidth <= 600) {
                sidebar.style.width = newWidth + 'px';
            }
        });

        document.addEventListener('mouseup', function () {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('is-resizing');
                document.body.style.cursor = 'default';
                document.body.style.userSelect = 'auto';
            }
        });
    </script>
</body>
</html>
