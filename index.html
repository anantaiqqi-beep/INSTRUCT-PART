<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Business One</title>
    <style>
        /* --- TEMA TERANG (LIGHT THEME - SAP Horizon) --- */
        [data-theme="light"] {
            --sap-background-color: #f5f6f7;
            --sap-shell-color: #ffffff;
            --sap-toolbar-color: #ffffff;
            --sap-sidebar-color: #ffffff;
            --sap-border-color: #d5dadd;
            --sap-text-primary: #223548;
            --sap-interactive-color: #0070f2;
            --sap-btn-hover: #f0f2f4;
        }

        /* --- TEMA GELAP (DARK THEME - SAP Horizon Dark) --- */
        [data-theme="dark"] {
            --sap-background-color: #12171c;
            --sap-shell-color: #1d232a;
            --sap-toolbar-color: #1d232a;
            --sap-sidebar-color: #181e24;
            --sap-border-color: #2e3742;
            --sap-text-primary: #f5f6f7;
            --sap-interactive-color: #4db2ff;
            --sap-btn-hover: #2a333d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background-color: var(--sap-background-color);
            color: var(--sap-text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. CONTAINER HEADER (SHELL) */
        .sap-header-container {
            background-color: var(--sap-shell-color);
            height: 48px;
            border-bottom: 1px solid var(--sap-border-color);
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        /* POSISI 1: BRAND / APP TITLE (KIRI) */
        .sap-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            color: var(--sap-text-primary);
        }

        .sap-header-brand span {
            color: var(--sap-interactive-color);
        }

        /* POSISI 2: USER & SWITCH THEME (KANAN) */
        .sap-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* SWITCH THEME TOGGLE */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .theme-switch-btn {
            background: none;
            border: 1px solid var(--sap-border-color);
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            color: var(--sap-text-primary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-switch-btn:hover {
            background-color: var(--sap-btn-hover);
        }

        /* USER ICON / AVATAR */
        .sap-user-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--sap-interactive-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        /* 2. CONTAINER MENU BAR / TOOLBAR */
        .sap-menu-bar-container {
            background-color: var(--sap-toolbar-color);
            height: 36px;
            border-bottom: 1px solid var(--sap-border-color);
            width: 100%;
        }

        /* 3. CONTAINER BODY */
        .sap-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
        }

        /* 4. CONTAINER SIDEBAR NAVIGASI */
        .sap-sidebar-container {
            width: 260px;
            background-color: var(--sap-sidebar-color);
            border-right: 1px solid var(--sap-border-color);
            overflow-y: auto;
        }

        /* 5. CONTAINER MAIN CONTENT */
        .sap-main-content-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- 1. Header Container -->
    <header class="sap-header-container">
        <!-- Posisi 1: Ananta Business One -->
        <div class="sap-header-brand">
            <span>Ananta</span> Business One
        </div>

        <!-- Posisi 2: Switch Theme & User Icon -->
        <div class="sap-header-controls">
            <button class="theme-switch-btn" id="themeToggle" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
            </button>
            <button class="sap-user-icon" title="Profil Pengguna">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>
    </header>

    <!-- 2. Menu Bar Container -->
    <nav class="sap-menu-bar-container"></nav>

    <!-- 3. Body Container -->
    <div class="sap-body-container">
        <!-- 4. Sidebar Container -->
        <aside class="sap-sidebar-container"></aside>

        <!-- 5. Main Content Container -->
        <main class="sap-main-content-container"></main>
    </div>

    <!-- SCRIPT SWITCH THEME (DARK / LIGHT) -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            
            // Update ikon dan teks tombol switch
            document.getElementById('themeIcon').textContent = newTheme === 'light' ? '🌙' : '☀️';
            document.getElementById('themeText').textContent = newTheme === 'light' ? 'Dark' : 'Light';
        }
    </script>

</body>
</html>
