<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Panel Kiri: Sidebar Menu Tree */
    .sidebar {
      width: 300px;
      min-width: 200px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px;
      overflow-y: auto;
    }

    /* Panel Kanan: Viewer Frame */
    .content-viewer {
      flex: 1;
      height: 100%;
      background-color: #fafafa;
    }

    .content-viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Styling Sederhana untuk Menu Tree */
    .menu-tree ul {
      list-style-type: none;
      padding-left: 15px;
    }

    .menu-tree li {
      margin: 8px 0;
    }

    .menu-tree a {
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .menu-tree a:hover {
      color: #0066cc;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Panel Kiri -->
    <aside class="sidebar">
      <h3>MENU TREE</h3>
      <nav class="menu-tree">
        <ul>
          <li>
            <span>📁 Folder Utama</span>
            <ul>
              <li>
                <a href="https://username.github.io/repo-name/page1.html" target="viewer-frame">
                  📄 Halaman 1 (GitHub)
                </a>
              </li>
              <li>
                <a href="https://username.github.io/repo-name/page2.html" target="viewer-frame">
                  📄 Halaman 2 (GitHub)
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Panel Kanan -->
    <main class="content-viewer">
      <iframe 
        name="viewer-frame" 
        src="about:blank" 
        title="Content Viewer">
      </iframe>
    </main>
  </div>

</body>
</html>
