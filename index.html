<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Business One</title>
    <style>
        /* --- VARIABEL WARNA (SAP Horizon Light & Dark) --- */
        [data-theme="light"] {
            --sap-background-color: #f5f6f7;
            --sap-shell-color: #ffffff;
            --sap-toolbar-color: #ffffff;
            --sap-sidebar-color: #ffffff;
            --sap-border-color: #d5dadd;
            --sap-text-primary: #223548;
            --sap-text-secondary: #5b738b;
            --sap-interactive-color: #0070f2;
            --sap-btn-hover: #f0f2f4;
            --sap-tree-hover: #eaf3fc;
            --sap-tree-selected: #d0e5fa;
            --sap-folder-icon: #f4b400; /* Warna Folder Khas SAP */
        }

        [data-theme="dark"] {
            --sap-background-color: #12171c;
            --sap-shell-color: #1d232a;
            --sap-toolbar-color: #1d232a;
            --sap-sidebar-color: #181e24;
            --sap-border-color: #2e3742;
            --sap-text-primary: #f5f6f7;
            --sap-text-secondary: #899eb3;
            --sap-interactive-color: #4db2ff;
            --sap-btn-hover: #2a333d;
            --sap-tree-hover: #25313d;
            --sap-tree-selected: #1d3954;
            --sap-folder-icon: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background-color: var(--sap-background-color);
            color: var(--sap-text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
        }

        /* 1. HEADER CONTAINER */
        .sap-header-container {
            background-color: var(--sap-shell-color);
            height: 48px;
            border-bottom: 1px solid var(--sap-border-color);
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .sap-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            color: var(--sap-text-primary);
        }

        .sap-header-brand span {
            color: var(--sap-interactive-color);
        }

        .sap-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-switch-btn {
            background: none;
            border: 1px solid var(--sap-border-color);
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            color: var(--sap-text-primary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-switch-btn:hover {
            background-color: var(--sap-btn-hover);
        }

        .sap-user-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--sap-interactive-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        /* 2. MENU BAR CONTAINER */
        .sap-menu-bar-container {
            background-color: var(--sap-toolbar-color);
            height: 36px;
            border-bottom: 1px solid var(--sap-border-color);
            width: 100%;
        }

        /* 3. BODY CONTAINER */
        .sap-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
        }

        /* 4. SIDEBAR CONTAINER (SAP MENU PANEL) */
        .sap-sidebar-container {
            width: 280px;
            background-color: var(--sap-sidebar-color);
            border-right: 1px solid var(--sap-border-color);
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* TAB NAVIGATION (Modules vs Favorites) */
        .sap-tab-header {
            display: flex;
            border-bottom: 1px solid var(--sap-border-color);
            background-color: var(--sap-shell-color);
        }

        .sap-tab-btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            color: var(--sap-text-secondary);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .sap-tab-btn.active {
            color: var(--sap-interactive-color);
            border-bottom-color: var(--sap-interactive-color);
        }

        .sap-tab-btn:hover:not(.active) {
            background-color: var(--sap-btn-hover);
        }

        /* TAB CONTENT & TREE VIEW */
        .sap-tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sap-tab-pane {
            display: none;
        }

        .sap-tab-pane.active {
            display: block;
        }

        /* SAP TREE MENU STYLES */
        .sap-tree-list {
            list-style: none;
            padding-left: 0;
        }

        .sap-tree-item {
            margin: 0;
        }

        .sap-tree-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            gap: 6px;
            color: var(--sap-text-primary);
        }

        .sap-tree-row:hover {
            background-color: var(--sap-tree-hover);
        }

        .sap-tree-row.selected {
            background-color: var(--sap-tree-selected);
            font-weight: bold;
        }

        /* Tree Arrow Indicator */
        .sap-tree-arrow {
            width: 12px;
            font-size: 9px;
            color: var(--sap-text-secondary);
            display: inline-block;
            transition: transform 0.15s ease;
        }

        .sap-tree-arrow.open {
            transform: rotate(90deg);
        }

        .sap-tree-arrow.empty {
            visibility: hidden;
        }

        /* SAP Folder Icon SVG */
        .sap-folder-icon {
            width: 16px;
            height: 16px;
            fill: var(--sap-folder-icon);
            flex-shrink: 0;
        }

        .sap-doc-icon {
            width: 16px;
            height: 16px;
            fill: var(--sap-text-secondary);
            flex-shrink: 0;
        }

        /* Sub-menu indentasi ala Tree */
        .sap-tree-children {
            display: none;
            padding-left: 18px;
        }

        .sap-tree-children.open {
            display: block;
        }

        /* 5. MAIN CONTENT CONTAINER */
        .sap-main-content-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- 1. Header Container -->
    <header class="sap-header-container">
        <div class="sap-header-brand">
            <span>Ananta</span> Business One
        </div>

        <div class="sap-header-controls">
            <button class="theme-switch-btn" id="themeToggle" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
            </button>
            <button class="sap-user-icon" title="Profil Pengguna">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>
    </header>

    <!-- 2. Menu Bar Container -->
    <nav class="sap-menu-bar-container"></nav>

    <!-- 3. Body Container -->
    <div class="sap-body-container">
        
        <!-- 4. Sidebar Container (SAP Menu Panel) -->
        <aside class="sap-sidebar-container">
            
            <!-- Tab Headers: Modules vs Favorites -->
            <div class="sap-tab-header">
                <button class="sap-tab-btn active" onclick="switchTab(event, 'tab-modules')">Modules</button>
                <button class="sap-tab-btn" onclick="switchTab(event, 'tab-favorites')">Favorites</button>
            </div>

            <!-- Tab Content -->
            <div class="sap-tab-content">
                
                <!-- TAB 1: SYSTEM MODULES -->
                <div id="tab-modules" class="sap-tab-pane active">
                    <ul class="sap-tree-list">
                        
                        <!-- Folder: Administration -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" onclick="toggleFolder(this)">
                                <span class="sap-tree-arrow">▶</span>
                                <svg class="sap-folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                                <span>Administration</span>
                            </div>
                            <ul class="sap-tree-children">
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>System Initialization</span>
                                    </div>
                                </li>
                            </ul>
                        </li>

                        <!-- Folder: Financials -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" onclick="toggleFolder(this)">
                                <span class="sap-tree-arrow">▶</span>
                                <svg class="sap-folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                                <span>Financials</span>
                            </div>
                            <ul class="sap-tree-children">
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>Chart of Accounts</span>
                                    </div>
                                </li>
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>Journal Entry</span>
                                    </div>
                                </li>
                            </ul>
                        </li>

                        <!-- Folder: Sales - A/R -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" onclick="toggleFolder(this)">
                                <span class="sap-tree-arrow open">▶</span>
                                <svg class="sap-folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                                <span>Sales - A/R</span>
                            </div>
                            <ul class="sap-tree-children open">
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>Sales Quotation</span>
                                    </div>
                                </li>
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row selected">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>Sales Order</span>
                                    </div>
                                </li>
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>A/R Invoice</span>
                                    </div>
                                </li>
                            </ul>
                        </li>

                        <!-- Folder: Purchasing - A/P -->
                        <li class="sap-tree-item">
                            <div class="sap-tree-row" onclick="toggleFolder(this)">
                                <span class="sap-tree-arrow">▶</span>
                                <svg class="sap-folder-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                                <span>Purchasing - A/P</span>
                            </div>
                            <ul class="sap-tree-children">
                                <li class="sap-tree-item">
                                    <div class="sap-tree-row">
                                        <span class="sap-tree-arrow empty">▶</span>
                                        <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                        <span>Purchase Order</span>
                                    </div>
                                </li>
                            </ul>
                        </li>

                    </ul>
                </div>

                <!-- TAB 2: FAVORITES MENU -->
                <div id="tab-favorites" class="sap-tab-pane">
                    <ul class="sap-tree-list">
                        <li class="sap-tree-item">
                            <div class="sap-tree-row">
                                <span class="sap-tree-arrow empty">▶</span>
                                <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                <span>Sales Order</span>
                            </div>
                        </li>
                        <li class="sap-tree-item">
                            <div class="sap-tree-row">
                                <span class="sap-tree-arrow empty">▶</span>
                                <svg class="sap-doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                <span>A/R Invoice</span>
                            </div>
                        </li>
                    </ul>
                </div>

            </div>

        </aside>

        <!-- 5. Main Content Container -->
        <main class="sap-main-content-container"></main>

    </div>

    <!-- JAVASCRIPT: TOGGLE THEME, TAB, & TREE EXPAND/COLLAPSE -->
    <script>
        // Switch Theme (Light/Dark)
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'light' ? '🌙' : '☀️';
            document.getElementById('themeText').textContent = newTheme === 'light' ? 'Dark' : 'Light';
        }

        // Switch Tab (Modules vs Favorites)
        function switchTab(event, tabId) {
            document.querySelectorAll('.sap-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sap-tab-pane').forEach(pane => pane.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Expand / Collapse Folder Tree
        function toggleFolder(element) {
            const children = element.nextElementSibling;
            const arrow = element.querySelector('.sap-tree-arrow');
            
            if (children && children.classList.contains('sap-tree-children')) {
                children.classList.toggle('open');
                arrow.classList.toggle('open');
            }
        }
    </script>

</body>
</html>
