<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Shell</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Container Kiri */
        #left-container {
            width: 250px;
            height: 100%;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        #left-header {
            height: 50px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
        }

        #file-list {
            flex: 1;
            overflow-y: auto;
        }

        /* Container Kanan */
        #right-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        #right-header {
            height: 50px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
        }

        #right-content {
            flex: 1;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Container Kiri -->
    <div id="left-container">
        <div id="left-header"></div>
        <div id="file-list"></div>
    </div>

    <!-- Container Kanan -->
    <div id="right-container">
        <div id="right-header"></div>
        <div id="right-content">
            <iframe id="content-frame" name="content-frame" src="about:blank"></iframe>
        </div>
    </div>

</body>
</html>
